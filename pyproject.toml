[project]
name = "job-dedup-rag"
version = "0.1.0"
description = "RAG workflow for detecting duplicate job postings across sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.11",
    "pinecone>=7.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
markers = [
    "live: requires OPENAI_API_KEY/PINECONE_API_KEY credentials, makes real network calls, and may incur real API cost",
    "mutating: live test that intentionally writes to and deletes from Pinecone; requires a guarded evaluation-* PINECONE_NAMESPACE",
]
addopts = "-m 'not live'"
